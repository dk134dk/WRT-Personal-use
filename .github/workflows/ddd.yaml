name: Cleanup Old Release Assets

on:
  workflow_dispatch:
    inputs:
      tag_names:
        description: 'Comma-separated list of tag names to clean up'
        required: true
        default: 'v1.0.0,v1.1.0'
      keep_days_assets:
        description: 'Keep assets newer than this number of days'
        required: false
        default: '30'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old release assets
        uses: your-username/delete-old-release-assets@v1
        with:
          tag_names: ${{ github.event.inputs.tag_names }}
          keep_days_assets: ${{ github.event.inputs.keep_days_assets }}
          token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
